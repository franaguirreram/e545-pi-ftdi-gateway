[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ftdi-gateway"
version = "0.3.1"
description = "Gateway PIGateway para hablar GCS2 con controladores PI (probado en E-545/E-517) sobre macOS, sin la DLL/dylib propietaria de PI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pipython",
    "pyftdi",
    "pyusb",
]

[tool.setuptools]
packages = ["pi_ftdi_gateway"]
